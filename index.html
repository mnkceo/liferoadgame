:root{
  color-scheme:dark;
  --night:#152766;
  --night-2:#233A85;
  --panel:#27429A;
  --panel-2:#3557BF;
  --panel-3:#4D74DD;
  --edge:rgba(255,255,255,.16);
  --edge-2:rgba(255,255,255,.28);
  --ink:#F2F4FF;
  --ink-soft:#D8E2FF;
  --ink-mute:#B7C5F6;
  --gold:#FFD85C;
  --gold-hi:#FFF2A8;
  --gold-lo:#FFAC2F;
  --gold-edge:#C87600;
  --coral:#FF7F64;
  --mint:#4FF3C2;
  --rose:#FF6FA2;
  --violet:#B28CFF;
  --violet-lo:#7A55F4;
  --cyan:#72EDFF;
  --r-n:#8E98BC;
  --r-r:#4DA3FF;
  --r-sr:#B982FF;
  --r-ssr:#F5C451;
  --c-good:#1DB483;
  --c-life:#E8A21B;
  --c-gacha:#8B5CF6;
  --c-bad:#E5484D;
  --c-none:#5A6698;
  --display:'LR Sans','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
  --body:'LR Sans','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif;
  --num:'LR Sans','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
}
*{box-sizing:border-box;}
html{height:100%;}
body{
  margin:0;min-height:100%;
  background:
    radial-gradient(80% 46% at 50% 0%, rgba(255,223,113,.30) 0%, transparent 65%),
    radial-gradient(55% 40% at 0% 18%, rgba(92,225,255,.24) 0%, transparent 72%),
    radial-gradient(60% 48% at 100% 100%, rgba(178,140,255,.25) 0%, transparent 72%),
    linear-gradient(180deg, #284CB4 0%, #17327E 45%, #10245D 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--body);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance;}
.num{font-family:var(--num);font-feature-settings:"tnum";font-variant-numeric:tabular-nums;letter-spacing:.01em;}
svg{display:block;}
#app{display:flex;flex-direction:column;min-height:100vh;max-width:520px;margin:0 auto;padding:0 16px;padding-block:0 12px;}
main{flex:1;padding-bottom:18px;}

/* ---------- panels & buttons ---------- */
.panel{
  background:linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 88%, white), var(--panel));
  border:1px solid var(--edge);
  border-radius:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 14px 30px rgba(8,18,56,.34);
}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-mute);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:14px;padding:14px 20px;
  font-size:15px;font-weight:900;letter-spacing:.04em;cursor:pointer;position:relative;
  transition:transform .08s, filter .15s, box-shadow .08s;
}
.btn:focus-visible,.nav-btn:focus-visible,.seg button:focus-visible,.tab-switch button:focus-visible,.pack:focus-visible,.item-card:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.btn:active{transform:translateY(2px);}
.btn svg{width:18px;height:18px;flex:none;}
.btn-primary{
  background:linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  color:#3B2500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(0,0,0,.12), 0 3px 0 var(--gold-edge), 0 10px 20px rgba(245,196,81,.22);
}
.btn-primary:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 var(--gold-edge);}
.btn-primary:disabled{background:var(--panel-3);color:var(--ink-mute);box-shadow:none;cursor:not-allowed;transform:none;}
.btn-gem{
  background:linear-gradient(180deg, #C4ABFF, var(--violet) 45%, var(--violet-lo));
  color:#fff;text-shadow:0 1px 1px rgba(40,10,110,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 3px 0 #4A2BB0, 0 10px 20px rgba(157,123,255,.25);
}
.btn-gem:disabled{background:var(--panel-3);color:var(--ink-mute);box-shadow:none;cursor:not-allowed;text-shadow:none;}
.btn-ghost{background:rgba(255,255,255,.10);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge-2), 0 8px 18px rgba(13,30,84,.16);}
.btn-block{width:100%;}
.btn .sub{font-family:var(--num);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:3px;opacity:.9;}
.btn .sub svg{width:15px;height:15px;}

/* ---------- currency ---------- */
.cur{display:inline-flex;align-items:center;gap:5px;font-family:var(--num);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
.cur svg{width:18px;height:18px;flex:none;}
.cur-pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 8px;border-radius:999px;
  background:rgba(4,8,28,.55);box-shadow:inset 0 0 0 1px var(--edge);
}
.cur-pill .plus{
  width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;padding:0;
  display:grid;place-items:center;background:linear-gradient(180deg,#C4ABFF,var(--violet-lo));color:#fff;
}
.cur-pill .plus svg{width:12px;height:12px;}

/* ---------- HUD ---------- */
.hud{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  margin:0 -16px 14px;padding:12px 16px 10px;
  background:linear-gradient(180deg, rgba(35,59,141,.96), rgba(21,39,102,.90));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--edge);
}
.hud-row{display:flex;align-items:center;gap:10px;}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.18), rgba(255,255,255,.02));
  box-shadow:0 0 0 2px var(--pc,#fff), 0 4px 10px rgba(0,0,0,.4);
}
.avatar{position:relative;display:block;}
.avatar svg{position:absolute;left:50%;top:0;transform:translateX(-50%);}
.hud-who{flex:1;min-width:0;}
.hud-who .turn{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--gold);}
.hud-who .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-who .nm small{font-weight:500;color:var(--ink-soft);font-size:12px;margin-left:6px;}
.hud-cur{display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
.stage-strip{display:flex;gap:3px;margin-top:10px;}
.stage-strip i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;}
.stage-strip i b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));border-radius:2px;}
.cpu-badge{display:inline-block;font-family:var(--num);font-size:10px;font-weight:800;letter-spacing:.08em;color:#1A1240;background:var(--cyan);padding:0 6px;border-radius:5px;margin-left:6px;vertical-align:2px;}

/* ---------- bottom nav ---------- */
.nav{
  position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20;
  display:flex;gap:2px;padding:6px;border-radius:20px;
  background:linear-gradient(180deg, rgba(67,98,197,.96), rgba(42,68,154,.96));
  backdrop-filter:blur(8px);
  border:1px solid var(--edge);
  box-shadow:0 16px 30px rgba(10,20,64,.32);
}
.nav-btn{
  flex:1;min-width:0;white-space:nowrap;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;border-radius:14px;padding:8px 2px 7px;
  color:var(--ink-mute);font-size:10px;font-weight:700;cursor:pointer;position:relative;
}
.nav-btn svg{width:22px;height:22px;}
.nav-btn.active{color:var(--gold);background:rgba(255,216,92,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
.nav-btn.active::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold);}


.solo-pause-btn{
  flex:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:var(--ink-soft);
  border-radius:10px;padding:7px 9px;font:inherit;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap;
}
.solo-pause-btn:active{transform:translateY(1px);}
.solo-pause-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

/* ---------- setup ---------- */
.hero{text-align:center;padding:34px 0 18px;}
.logo-mark{
  font-family:var(--display);font-weight:900;font-size:44px;line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,#FFF3C7 0%, var(--gold) 55%, var(--gold-lo) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #8A5608) drop-shadow(0 10px 18px rgba(255,216,92,.36));
}
.hero .tag{margin-top:12px;color:var(--ink-soft);font-size:13.5px;line-height:1.8;}
.hero-showcase{
  margin:20px 0 4px;
  padding:14px;
  border-radius:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
  box-shadow:inset 0 0 0 1px var(--edge);
}
.hero-showcase-row{display:grid;gap:10px;align-items:end;}
.hero-showcase-row.cars{grid-template-columns:repeat(4,minmax(0,1fr));}
.hero-showcase-row.people{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px;align-items:end;}
.hero-showcase-item{
  min-width:0;
  min-height:68px;
  border-radius:14px;
  background:rgba(19,33,84,.34);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:8px 4px 5px;
  overflow:hidden;
}
.hero-showcase-row.people .hero-showcase-item{min-height:92px;}
.hero-showcase-item svg{display:block;max-width:100%;height:auto;overflow:visible;}
.hero-showcase-row.cars .hero-showcase-item{min-height:78px;padding:5px 2px 2px;}
.hero-showcase-row.people .hero-showcase-item{min-height:104px;padding:5px 2px 3px;}
.hero-showcase-row.cars svg{width:100%;max-height:72px;}
.hero-showcase-row.people svg{width:auto;max-height:98px;}
.hero-showcase-item{background:
  radial-gradient(circle at 50% 16%,rgba(255,255,255,.14),transparent 52%),
  linear-gradient(180deg, rgba(84,111,208,.36), rgba(27,48,120,.30));}
.hero-showcase-item:after{
  content:"";position:absolute;left:15%;right:15%;bottom:5px;height:6px;
  border-radius:50%;background:rgba(0,0,0,.25);filter:blur(3px);z-index:0;
}
.hero-showcase-item{position:relative;}
.hero-showcase-item svg{position:relative;z-index:1;}
@media(max-width:380px){
  .hero-showcase{padding:10px;}
  .hero-showcase-row{gap:6px;}
  .hero-showcase-item{min-height:60px;padding:6px 2px 4px;}
  .hero-showcase-row.people .hero-showcase-item{min-height:92px;}
}
.setup-card{padding:18px;}
.setup-card .row-head{display:flex;justify-content:space-between;align-items:center;}
.stepper{display:flex;align-items:center;gap:6px;background:rgba(4,8,28,.5);border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1px var(--edge);}
.stepper button{width:32px;height:32px;border:none;border-radius:9px;background:var(--panel-3);cursor:pointer;display:grid;place-items:center;}
.stepper button svg{width:14px;height:14px;}
.stepper .n{font-family:var(--num);font-size:20px;font-weight:800;min-width:26px;text-align:center;}
.player-form{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.player-row{
  display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;
  padding:12px;border-radius:14px;background:rgba(4,8,28,.35);box-shadow:inset 0 0 0 1px var(--edge);
}
.player-row input[type="text"]{
  width:100%;border:none;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700;
  background:rgba(255,255,255,.06);color:var(--ink);font-family:inherit;min-width:0;
  box-shadow:inset 0 0 0 1px var(--edge);
}
.player-row input:focus{outline:2px solid var(--gold);outline-offset:0;}
.player-row .controls{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.color-picker{display:flex;gap:7px;}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:none;padding:0;box-shadow:inset 0 -3px 4px rgba(0,0,0,.25), inset 0 2px 2px rgba(255,255,255,.3);}
.color-dot.selected{box-shadow:0 0 0 2px var(--night), 0 0 0 4px var(--ink), inset 0 -3px 4px rgba(0,0,0,.25);}
.seg{display:flex;background:rgba(4,8,28,.6);border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px var(--edge);}
.seg button{border:none;background:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-mute);cursor:pointer;}
.seg button.on{background:var(--panel-3);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.1) inset;}
.note{font-size:12px;color:var(--ink-mute);line-height:1.7;margin:12px 0 0;}


/* ---------- home / online / lobby ---------- */
.modes{display:flex;flex-direction:column;gap:10px;}
.mode-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;cursor:pointer;padding:16px;border-radius:18px;color:var(--ink);
  background:linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 92%, white), var(--panel));box-shadow:inset 0 0 0 1px var(--edge-2), 0 12px 24px rgba(9,18,62,.28);}
.mode-card:active{transform:translateY(2px);}
.mode-card:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.mode-card .mi{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg, color-mix(in srgb, var(--mc) 85%, #fff), var(--mc));box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 6px 12px rgba(0,0,0,.3);}
.mode-card .mi svg{width:26px;height:26px;}
.mode-card > span:nth-child(2){flex:1;min-width:0;}
.mode-card b{display:block;font-size:17px;font-weight:900;}
.mode-card small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}
.mode-card .go{width:18px;height:18px;color:var(--ink-mute);flex:none;}
.page-head{display:flex;align-items:center;gap:12px;padding:22px 0 14px;}
.page-head h2{font-family:var(--display);font-weight:900;font-weight:900;font-size:22px;}
.back-btn{width:40px;height:40px;flex:none;border:none;border-radius:12px;cursor:pointer;display:grid;place-items:center;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--edge-2);}
.back-btn svg{width:20px;height:20px;}
.join-row{display:flex;gap:10px;margin-top:10px;}
.code-input{flex:1;min-width:0;border:none;border-radius:12px;padding:12px;font-family:var(--num);font-size:24px;font-weight:900;letter-spacing:.3em;text-align:center;text-transform:uppercase;background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge-2);}
.code-input:focus{outline:2px solid var(--gold);}
.code-card{padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.room-code{font-family:var(--num);font-weight:900;font-size:52px;letter-spacing:.22em;line-height:1.1;color:var(--gold-hi);text-shadow:0 3px 0 rgba(0,0,0,.35);padding-left:.22em;}
.seat-count{font-family:var(--num);font-weight:800;color:var(--ink-soft);}
.seat-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.seat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(4,8,28,.35);box-shadow:inset 0 0 0 1px var(--edge);}
.seat b{font-size:15px;}
.seat .you,.seat .host{font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:6px;}
.seat .you{background:var(--cyan);color:#10163A;}
.seat .host{background:var(--gold);color:#3B2500;}
.seat.empty{opacity:.55;}
.seat.empty .avatar{box-shadow:inset 0 0 0 2px dashed var(--edge-2);border:2px dashed var(--edge-2);}
.seat.empty span{font-size:13px;color:var(--ink-mute);}
.wait-card{margin-top:16px;padding:16px;text-align:center;color:var(--ink-soft);font-weight:700;}

/* ---------- world map ---------- */
@property --fx{syntax:'<length>';inherits:true;initial-value:0px;}
@property --fy{syntax:'<length>';inherits:true;initial-value:0px;}
@property --rz{syntax:'<angle>';inherits:true;initial-value:0deg;}
.map-frame{padding:6px;border-radius:22px;}
.world3d{
  --vw:360px;--vh:420px;
  position:relative;height:min(60vh,440px);overflow:hidden;border-radius:16px;
  perspective:760px;perspective-origin:50% 12%;
  background:linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 38%, var(--sky-b) 100%);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);
}
.world3d.grabbing{cursor:grabbing;}
.cam{
  position:absolute;left:0;top:0;transform-style:preserve-3d;
  transform-origin:var(--fx) var(--fy);
  transform:translate(calc(var(--vw) * .5 - var(--fx)), calc(var(--vh) * .7 - var(--fy))) rotateX(58deg) rotateZ(var(--rz));
  transition:--fx .9s cubic-bezier(.3,.7,.2,1), --fy .9s cubic-bezier(.3,.7,.2,1), --rz .9s cubic-bezier(.3,.7,.2,1);
}
.cam.dragging{transition:none;}
.world-road{position:absolute;left:0;top:0;pointer-events:none;}
.flat-deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none;}
.bb{position:absolute;width:0;height:0;transform-style:preserve-3d;transform:rotateZ(calc(var(--rz) * -1)) rotateX(-58deg);pointer-events:none;}
.bb.lift{transform:translateZ(8px) rotateZ(calc(var(--rz) * -1)) rotateX(-58deg);}
.bb-in{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
.bb-in > svg{filter:drop-shadow(0 4px 3px rgba(10,15,40,.25));}
.tile3d{position:absolute;width:0;height:0;transform-style:preserve-3d;}
.tile3d .tside,.tile3d .ttop{position:absolute;left:-25px;top:-25px;width:50px;height:50px;border-radius:50%;}
.tile3d .tside{background:color-mix(in srgb, var(--cat) 70%, #0C1230);transform:translateZ(1px);box-shadow:0 0 0 4px rgba(10,15,40,.18);}
.tile3d .ttop{
  transform:translateZ(8px);display:grid;place-items:center;color:var(--cat);
  background:radial-gradient(circle at 50% 30%, #FFFFFF, #E1E6F3);
  box-shadow:inset 0 0 0 3.5px var(--cat), inset 0 0 0 6px #fff;
}
.tile3d .ttop svg{width:24px;height:24px;}
.tile3d .idx{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-family:var(--num);font-size:10px;font-weight:800;color:#fff;background:var(--cat);padding:0 5px;border-radius:6px;line-height:14px;}
.tile3d.big .tside,.tile3d.big .ttop{left:-32px;top:-32px;width:64px;height:64px;}
.tile3d.goal .ttop{background:radial-gradient(circle at 50% 30%, var(--gold-hi), var(--gold-lo));color:#5A3300;box-shadow:inset 0 0 0 3.5px #fff, 0 0 26px rgba(255,224,138,.95);}
.tile3d.goal .idx{background:#5A3300;}
.tok-base{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;transform:translateZ(9px);background:radial-gradient(circle, color-mix(in srgb, var(--pc) 70%, transparent) 0 45%, transparent 70%);pointer-events:none;}
.tok-base.current{animation:basePulse3 1.3s ease-in-out infinite;}
@keyframes basePulse3{0%,100%{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--pc);}50%{box-shadow:0 0 0 3px #fff, 0 0 0 14px color-mix(in srgb, var(--pc) 30%, transparent);}}
.tok .bb-in{bottom:-6px;}
.tok-tag{margin-bottom:3px;padding:2px 9px;border-radius:999px;background:var(--pc);color:#fff;font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 0 0 2px #fff, 0 4px 8px rgba(0,0,0,.3);position:relative;animation:tagBob 1.2s ease-in-out infinite;}
.tok-tag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--pc);border-bottom:0;}
@keyframes tagBob{50%{transform:translateY(-4px);}}
.tok-dot{width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px #fff;margin-bottom:3px;}
.stage-sign{padding:5px 10px 4px;border-radius:10px;background:rgba(12,18,48,.88);box-shadow:0 0 0 2px #fff;color:#fff;text-align:center;white-space:nowrap;}
.stage-sign b{display:block;font-family:var(--num);font-size:10px;letter-spacing:.12em;color:var(--gold);}
.stage-sign span{font-size:13px;font-weight:900;}
.stage-sign i{position:absolute;left:50%;top:100%;width:4px;height:26px;margin-left:-2px;background:#E9ECF6;}
.stage-sign{margin-bottom:26px;}
.fog{position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none;background:linear-gradient(180deg, var(--sky-a) 0%, color-mix(in srgb, var(--sky-b) 85%, transparent) 45%, transparent 100%);}
.map-hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;}
.map-stage{background:rgba(8,12,34,.62);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:900;padding:6px 11px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}
.recenter{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;border:none;cursor:pointer;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:900;color:#3B2500;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));box-shadow:0 2px 0 var(--gold-edge), 0 6px 12px rgba(0,0,0,.3);}
.recenter[hidden]{display:none;}
.recenter svg{width:15px;height:15px;}
.drag-hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:#fff;background:rgba(8,12,34,.5);padding:3px 9px;border-radius:8px;pointer-events:none;}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
.map-legend span{display:inline-flex;align-items:center;gap:5px;}
.map-legend i{width:10px;height:10px;border-radius:50%;background:var(--cat);box-shadow:0 0 0 2px rgba(255,255,255,.2);}

/* ---------- roll area ---------- */
.roll-area{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border-radius:18px;}
.dice-box{width:64px;height:64px;flex:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));}
.dice-box.spinning{animation:diceSpin .18s linear infinite;}
@keyframes diceSpin{0%{transform:rotate(-10deg) scale(1.02);}50%{transform:rotate(10deg) scale(.96);}100%{transform:rotate(-10deg) scale(1.02);}}
.roll-area .btn{flex:1;}
.roll-area .hint{font-size:11.5px;color:var(--ink-mute);margin-top:6px;text-align:center;}

.standings{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
.stand{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--edge);
}
.stand.current{background:linear-gradient(90deg, rgba(245,196,81,.13), rgba(245,196,81,.02));box-shadow:inset 0 0 0 1px rgba(245,196,81,.35);}
.stand.finished{opacity:.55;}
.stand .nm{font-weight:900;font-size:13.5px;display:flex;align-items:center;min-width:0;}
.stand .nm .dot{width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none;}
.stand .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stand .meta{font-size:11px;color:var(--ink-mute);margin-top:1px;}
.stand .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.stand .right .cur{font-size:13px;}
.stand .right .cur svg{width:14px;height:14px;}
.stand .pos{font-family:var(--num);font-size:11px;font-weight:700;color:var(--ink-mute);}
.progress-mini{width:70px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;}
.progress-mini b{display:block;height:100%;background:var(--pc);}

.roll-overlay{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 45%, rgba(20,28,70,.55), rgba(4,7,22,.72));animation:fadeIn .18s ease-out;pointer-events:none;}
.roll-overlay.out{animation:fadeOut .25s ease-in forwards;}
@keyframes fadeOut{to{opacity:0;}}
.roll-who{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);}
.big-dice{width:124px;height:124px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));}
.big-dice.tumble{animation:tumble .34s linear infinite;}
@keyframes tumble{0%{transform:rotate(0) translateY(0);}25%{transform:rotate(90deg) translateY(-22px);}50%{transform:rotate(180deg) translateY(0);}75%{transform:rotate(270deg) translateY(-14px);}100%{transform:rotate(360deg) translateY(0);}}
.big-dice.land{animation:land .5s cubic-bezier(.2,.9,.3,1.5);}
@keyframes land{0%{transform:scale(1.4) rotate(-14deg);}100%{transform:none;}}
.roll-result{min-height:52px;font-family:var(--display);font-weight:900;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);opacity:0;display:flex;align-items:baseline;gap:6px;}
.roll-result b{font-size:48px;color:var(--gold);font-family:var(--num);font-weight:900;}
.roll-result.show{animation:titleIn .35s forwards;}

/* ---------- driver view ---------- */
.drive-scene{position:relative;height:min(56vh,420px);border-radius:20px;overflow:hidden;background:#0B0D18;box-shadow:inset 0 0 0 1px var(--edge), 0 14px 30px rgba(3,6,20,.5);}
.drive-sky{position:absolute;left:0;right:0;top:0;height:44%;overflow:hidden;background:linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 100%);}
.drive-sun{position:absolute;left:62%;top:34%;width:130px;height:130px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle, var(--sun) 0%, color-mix(in srgb, var(--sun) 40%, transparent) 30%, transparent 68%);}
.drive-clouds{position:absolute;left:0;right:0;top:8%;height:24%;overflow:hidden;pointer-events:none;}
.drive-track{position:absolute;display:flex;align-items:center;width:max-content;animation:driveX 20s linear infinite;}
.drive-clouds .drive-track{top:10%;left:0;gap:60px;}
.drive-cloud{flex:none;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:18px -8px 0 -2px rgba(255,255,255,.72), -14px -4px 0 -4px rgba(255,255,255,.6);}
.drive-star{flex:none;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.8);}
.drive-far{position:absolute;left:0;right:0;bottom:56%;height:24%;overflow:hidden;pointer-events:none;}
.drive-far .drive-track{bottom:0;left:0;align-items:flex-end;animation-duration:30s;}
.drive-hill{flex:none;border-radius:50% 50% 0 0;margin-right:-24px;}
.drive-near{position:absolute;left:0;right:0;bottom:56%;height:9%;overflow:hidden;pointer-events:none;}
.drive-near .drive-track{bottom:0;left:0;align-items:flex-end;gap:14px;animation-duration:6s;}
.drive-tree{flex:none;border-radius:50% 50% 45% 45%;}
@keyframes driveX{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.drive-ground{position:absolute;left:0;right:0;bottom:0;height:56%;background:linear-gradient(180deg, var(--hill-b), color-mix(in srgb, var(--hill-b) 70%, #000));}
.drive-road{position:absolute;left:0;right:0;bottom:0;height:56%;background:linear-gradient(180deg,#4A5174,#2A2F4A);clip-path:polygon(47% 0%, 53% 0%, 125% 100%, -25% 100%);}
.drive-curb{position:absolute;left:0;right:0;bottom:0;height:56%;background:repeating-linear-gradient(180deg,#fff 0 14px,#E5484D 14px 28px);background-size:100% 28px;animation:laneY .3s linear infinite;}
.drive-curb.l{clip-path:polygon(46.5% 0%, 47% 0%, -25% 100%, -33% 100%);}
.drive-curb.r{clip-path:polygon(53% 0%, 53.5% 0%, 133% 100%, 125% 100%);}
.drive-centerline{position:absolute;left:0;right:0;bottom:0;height:56%;clip-path:polygon(49.8% 0%, 50.2% 0%, 53% 100%, 47% 100%);background:repeating-linear-gradient(180deg, var(--gold) 0 26px, transparent 26px 56px);background-size:100% 56px;animation:laneY .3s linear infinite;}
@keyframes laneY{from{background-position-y:0;}to{background-position-y:56px;}}
.drive-sign{position:absolute;left:66%;top:47%;transform:translate(-50%,-100%) scale(1);transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;z-index:1;}
.drive-sign .plate{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--cat);box-shadow:0 0 0 3px var(--cat), 0 6px 12px rgba(0,0,0,.35);}
.drive-sign .plate svg{width:24px;height:24px;}
.drive-sign .pole{width:4px;height:22px;background:linear-gradient(90deg,#B9C0D6,#EEF1F8);}
.drive-sign.passing{animation:signPass .62s ease-in forwards;}
@keyframes signPass{from{left:54%;top:45%;transform:translate(-50%,-100%) scale(.35);}to{left:92%;top:66%;transform:translate(-50%,-100%) scale(2.2);opacity:.2;}}
.drive-scene.parked .drive-track,.drive-scene.parked .drive-curb,.drive-scene.parked .drive-centerline{animation-play-state:paused;}
.cockpit{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.cockpit .wheel{transform-box:view-box;transform-origin:180px 398px;animation:steer 2.4s ease-in-out infinite;}
.cockpit .needle{transform-box:view-box;animation:needle .5s ease-in-out infinite alternate;}
.cockpit .n1{transform-origin:148px 322px;}
.cockpit .n2{transform-origin:212px 322px;}
.drive-scene.parked .cockpit .wheel,.drive-scene.parked .cockpit .needle{animation:none;}
.drive-scene:not(.parked) .cockpit .n1{transform:rotate(95deg);}
.drive-scene:not(.parked) .cockpit .n2{transform:rotate(60deg);}
@keyframes steer{0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
@keyframes needle{from{rotate:-4deg;}to{rotate:4deg;}}
.cockpit-shake{position:absolute;inset:0;}
.drive-scene:not(.parked) .cockpit-shake{animation:rumble .18s linear infinite;}
@keyframes rumble{0%,100%{transform:translateY(0);}50%{transform:translateY(1.2px);}}
.drive-hud{position:absolute;top:34px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3;pointer-events:none;}
.drive-tag{background:rgba(8,12,34,.62);backdrop-filter:blur(6px);border-radius:12px;padding:7px 11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.drive-tag .a{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--gold);}
.drive-tag .b{font-size:13px;font-weight:900;}
.drive-hud .dice-box{width:52px;height:52px;}

/* ---------- tokens ---------- */
.car-svg.glow,.char-svg.glow{filter:drop-shadow(0 0 6px rgba(255,214,110,.75));}
.silhouette{filter:brightness(0) invert(.35);opacity:.35;}

/* ---------- modal / event card ---------- */
#modalHost{position:relative;z-index:100;}
.modal-overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,7,22,.66);backdrop-filter:blur(3px);animation:fadeIn .2s ease-out;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.ev-card{
  width:100%;max-width:360px;max-height:86vh;overflow:auto;border-radius:22px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 90%, white), var(--panel));
  border:1px solid var(--edge-2);
  box-shadow:0 30px 60px rgba(0,0,0,.55);
  animation:cardIn .32s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes cardIn{from{transform:translateY(20px) scale(.94);opacity:0;}to{transform:none;opacity:1;}}
.ev-head{
  position:relative;height:92px;
  background:
    radial-gradient(120% 140% at 50% 0%, color-mix(in srgb, var(--cat) 90%, #fff) 0%, var(--cat) 45%, color-mix(in srgb, var(--cat) 55%, #0C1230) 100%);
  display:flex;align-items:flex-end;justify-content:center;
}
.ev-head::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 12px, transparent 12px 26px);}
.ev-medal{
  position:relative;width:76px;height:76px;margin-bottom:-38px;border-radius:50%;
  display:grid;place-items:center;color:var(--cat);
  background:radial-gradient(circle at 50% 30%, #fff, #E3E7F4);
  box-shadow:0 0 0 4px var(--panel-2), 0 0 0 6px color-mix(in srgb, var(--cat) 70%, #fff), 0 10px 18px rgba(0,0,0,.4);
}
.ev-medal svg{width:36px;height:36px;}
.ev-body{padding:48px 20px 20px;text-align:center;}
.ev-cat{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:color-mix(in srgb, var(--cat) 70%, #fff);}
.ev-title{font-family:var(--display);font-weight:900;font-size:22px;margin:4px 0 10px;}
.ev-text{color:var(--ink-soft);font-size:14px;line-height:1.8;margin:0 0 16px;}
.ev-extra{margin-bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:12px;
  font-family:var(--num);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--edge-2);
  animation:chipPop .45s cubic-bezier(.2,.8,.3,1.4) both;
}
.chip:nth-child(2){animation-delay:.08s;}
.chip:nth-child(3){animation-delay:.16s;}
.chip svg{width:18px;height:18px;}
.chip.pos{color:var(--mint);box-shadow:inset 0 0 0 1px rgba(67,221,168,.35);background:rgba(67,221,168,.08);}
.chip.neg{color:var(--rose);box-shadow:inset 0 0 0 1px rgba(255,99,128,.35);background:rgba(255,99,128,.08);}
.chip.gem{color:#CDBBFF;box-shadow:inset 0 0 0 1px rgba(157,123,255,.4);background:rgba(157,123,255,.1);}
.chip.pt{color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(245,196,81,.35);background:rgba(245,196,81,.08);}
.chip.txt{font-family:var(--body);font-size:13px;font-weight:900;color:var(--ink);}
@keyframes chipPop{from{transform:scale(.4) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.choices{display:flex;flex-direction:column;gap:8px;}
.job-option{
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;
  padding:12px 14px;border-radius:14px;cursor:pointer;border:none;width:100%;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--edge-2);
}
.job-option:hover{background:rgba(255,255,255,.07);}
.job-option b{font-size:15px;font-weight:900;}
.job-option .pay{grid-row:span 2;font-family:var(--num);font-weight:800;font-size:18px;color:var(--gold);text-align:right;line-height:1.1;}
.job-option .pay small{display:block;font-size:10px;color:var(--ink-mute);font-family:var(--body);font-weight:700;}
.job-option span.d{font-size:12px;color:var(--ink-soft);}
.job-option:disabled{opacity:.4;cursor:not-allowed;}
.auto-note{font-size:11.5px;color:var(--ink-mute);margin-top:10px;}

/* ---------- toast / confetti ---------- */
.toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:220;
  display:flex;align-items:center;gap:8px;max-width:92vw;
  background:linear-gradient(180deg,var(--panel-3),var(--panel-2));color:var(--ink);
  padding:10px 16px;border-radius:14px;font-size:13px;font-weight:700;
  box-shadow:inset 0 0 0 1px var(--edge-2), 0 14px 30px rgba(0,0,0,.5);
  animation:toastIn 2.6s ease both;pointer-events:none;
}
.toast svg{width:18px;height:18px;flex:none;color:var(--gold);}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-14px);}10%,84%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,-8px);}}
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:210;overflow:hidden;}
.confetti-layer span{position:absolute;top:-16px;width:7px;height:13px;border-radius:2px;animation:confFall 2.8s cubic-bezier(.3,.6,.5,1) forwards;}
@keyframes confFall{0%{transform:translateY(0) rotate(0);opacity:1;}100%{transform:translateY(106vh) rotate(760deg);opacity:.3;}}

/* ---------- gacha ---------- */
.banner{
  position:relative;overflow:hidden;border-radius:22px;padding:18px 16px 16px;
  background:
    radial-gradient(70% 90% at 50% 40%, rgba(255,214,110,.28), transparent 70%),
    conic-gradient(from 0deg at 50% 45%, rgba(255,255,255,.07) 0 10deg, transparent 10deg 30deg, rgba(255,255,255,.07) 30deg 40deg, transparent 40deg 60deg, rgba(255,255,255,.07) 60deg 70deg, transparent 70deg 90deg, rgba(255,255,255,.07) 90deg 100deg, transparent 100deg 120deg, rgba(255,255,255,.07) 120deg 130deg, transparent 130deg 150deg, rgba(255,255,255,.07) 150deg 160deg, transparent 160deg 180deg, rgba(255,255,255,.07) 180deg 190deg, transparent 190deg 210deg, rgba(255,255,255,.07) 210deg 220deg, transparent 220deg 240deg, rgba(255,255,255,.07) 240deg 250deg, transparent 250deg 270deg, rgba(255,255,255,.07) 270deg 280deg, transparent 280deg 300deg, rgba(255,255,255,.07) 300deg 310deg, transparent 310deg 330deg, rgba(255,255,255,.07) 330deg 340deg, transparent 340deg 360deg),
    linear-gradient(160deg, #3B2A8C, #1D1757 60%, #120F3A);
  border:1px solid rgba(185,130,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 18px 36px rgba(20,10,60,.6);
}
.banner-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;}
.banner .kicker{font-family:var(--num);font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--gold-hi);}
.banner h2{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.2;margin-top:2px;}
.banner .sub{font-size:12px;color:#CFC4FF;margin-top:4px;}
.pickup{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px 0 6px;height:120px;}
.pickup .spot{position:absolute;bottom:0;left:50%;width:260px;height:26px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side, rgba(255,224,138,.45), transparent);}
.pickup > div{position:relative;display:flex;flex-direction:column;align-items:center;}
.pickup-label{position:relative;text-align:center;font-size:11px;color:#D9CCFF;margin-bottom:12px;}
.pickup-label b{color:var(--gold-hi);font-weight:900;}
.gacha-btns{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gacha-btns .btn{flex-direction:column;gap:2px;padding:10px 8px;}
.gacha-btns .btn .main{font-size:15px;}
.pity{position:relative;margin-top:14px;font-size:11.5px;color:#CFC4FF;display:flex;justify-content:space-between;}
.pity b{font-family:var(--num);color:var(--gold-hi);font-size:14px;}
.pity-bar{position:relative;height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:6px;}
.pity-bar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));}

.pull-stage{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:16px;}
.pull-stage:empty{display:none;}
.rcard{
  position:relative;overflow:hidden;border-radius:14px;padding:22px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-height:128px;
  background:radial-gradient(90% 60% at 50% 35%, color-mix(in srgb, var(--rc) 30%, transparent), transparent 75%), linear-gradient(180deg, var(--panel-2), var(--panel));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--rc) 70%, transparent), 0 8px 16px rgba(0,0,0,.35);
}
.rcard .rtag{position:absolute;top:6px;left:6px;}
.rcard .nm{font-size:10.5px;font-weight:700;line-height:1.3;}
.rcard .foot{font-family:var(--num);font-size:10.5px;font-weight:700;color:var(--ink-mute);display:inline-flex;align-items:center;gap:2px;}
.rcard .foot svg{width:11px;height:11px;}
.rcard .new{font-family:var(--num);font-size:10px;font-weight:800;letter-spacing:.1em;color:#2A1700;background:var(--gold);padding:0 6px;border-radius:4px;}
.pull-stage .rcard{animation:flipIn .5s cubic-bezier(.2,.8,.3,1.2) both;}
@keyframes flipIn{from{transform:rotateY(100deg) scale(.7);opacity:0;}to{transform:none;opacity:1;}}
.rcard.r-SSR::after,.pickup .shine::after{
  content:"";position:absolute;inset:-50%;background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.45) 50%, transparent 60%);
  animation:shine 2.6s ease-in-out infinite;
}
@keyframes shine{0%{transform:translateX(-60%);}60%,100%{transform:translateX(60%);}}
.rtag{display:inline-block;font-family:var(--num);font-weight:800;font-size:10.5px;letter-spacing:.06em;padding:1px 7px;border-radius:5px;color:#fff;background:var(--rc);}
.rtag.r-SSR{background:linear-gradient(90deg,#FFE9A8,var(--gold),#FFB84D);color:#3A2400;}
.r-N{--rc:var(--r-n);} .r-R{--rc:var(--r-r);} .r-SR{--rc:var(--r-sr);} .r-SSR{--rc:var(--r-ssr);}
details.rates{margin-top:14px;border-radius:16px;padding:0 16px;}
details.rates summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:13px;color:var(--ink-soft);list-style:none;display:flex;justify-content:space-between;}
details.rates summary::after{content:"＋";color:var(--ink-mute);}
details.rates[open] summary::after{content:"－";}
.rate-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:12.5px;}
.rate-row .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.rate-row .bar b{display:block;height:100%;background:var(--rc);}
.rate-row .pct{font-family:var(--num);font-weight:700;}
.rates p{font-size:12px;color:var(--ink-mute);line-height:1.8;margin:6px 0 14px;}

/* capsule */
.modal-overlay.pull-overlay{background:radial-gradient(circle at 50% 45%, rgba(40,30,110,.8), rgba(4,6,20,.94));}
.capsule-stage{position:relative;width:260px;height:300px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.capsule{width:112px;height:112px;position:relative;animation:capShake 1.05s ease-in-out, capPop .35s 1.05s ease-in forwards;filter:drop-shadow(0 16px 20px rgba(0,0,0,.5));}
.capsule .cap-top{position:absolute;top:0;left:0;right:0;height:50%;border-radius:56px 56px 0 0;background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), var(--cap-c);}
.capsule .cap-bot{position:absolute;bottom:0;left:0;right:0;height:50%;border-radius:0 0 56px 56px;background:linear-gradient(180deg,#fff,#CBD3E6);}
.capsule .cap-band{position:absolute;left:-3px;right:-3px;top:calc(50% - 5px);height:10px;border-radius:5px;background:#1E2340;}
.capsule .cap-btn{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #1E2340;}
.capsule-stage .rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg, var(--cap-glow) 0 8deg, transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle, #000 0%, transparent 62%);mask:radial-gradient(circle, #000 0%, transparent 62%);
  opacity:0;animation:raysIn .8s 1.05s ease-out forwards, spinR 12s linear infinite;pointer-events:none;}
.capsule-stage .glow{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle, var(--cap-glow), transparent 65%);opacity:0;animation:raysIn .6s 1.05s ease-out forwards;pointer-events:none;}
.capsule-stage .pull-title{position:absolute;top:18px;font-family:var(--display);font-weight:900;font-size:28px;opacity:0;animation:titleIn .45s 1.1s forwards;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 22px var(--cap-glow);}
.capsule-stage .pull-caption{position:absolute;bottom:0;color:rgba(255,255,255,.55);font-size:12px;}
.top-N{--cap-c:#8E98BC;--cap-glow:rgba(220,228,255,.55);}
.top-R{--cap-c:#4DA3FF;--cap-glow:rgba(77,163,255,.75);}
.top-SR{--cap-c:#B982FF;--cap-glow:rgba(185,130,255,.85);}
.top-SSR{--cap-c:linear-gradient(90deg,#FF6B5A,#F5C451,#43DDA8,#9D7BFF);--cap-glow:rgba(255,214,110,.95);}
@keyframes capShake{0%,100%{transform:rotate(0);}15%{transform:rotate(-14deg);}30%{transform:rotate(12deg);}45%{transform:rotate(-10deg);}60%{transform:rotate(8deg) scale(1.05);}78%{transform:rotate(-4deg) scale(1.1);}}
@keyframes capPop{to{transform:scale(1.7);opacity:0;}}
@keyframes raysIn{from{opacity:0;}to{opacity:1;}}
@keyframes spinR{to{transform:rotate(360deg);}}
@keyframes titleIn{from{opacity:0;transform:translateY(10px) scale(.9);}to{opacity:1;transform:none;}}

/* ---------- shop ---------- */
.shop-head{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.shop-head h2{font-family:var(--display);font-weight:900;font-size:22px;}
.shop-head .cur{font-size:20px;}
.shop-head .cur svg{width:24px;height:24px;}
.demo-note{font-size:11.5px;color:var(--ink-mute);line-height:1.7;margin:10px 2px 12px;}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pack{
  position:relative;border:none;cursor:pointer;text-align:center;border-radius:18px;padding:16px 10px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:radial-gradient(80% 60% at 50% 30%, rgba(157,123,255,.28), transparent 75%), linear-gradient(180deg, var(--panel-2), var(--panel));
  box-shadow:inset 0 0 0 1px var(--edge-2), 0 10px 20px rgba(0,0,0,.35);
}
.pack:active{transform:translateY(2px);}
.pack .gems{height:58px;display:flex;align-items:flex-end;justify-content:center;}
.pack .amt{font-family:var(--num);font-weight:800;font-size:22px;}
.pack .bonus{font-size:11px;font-weight:700;color:var(--gold-hi);min-height:16px;}
.pack .price{margin-top:4px;width:100%;padding:8px;border-radius:11px;font-family:var(--num);font-weight:800;font-size:16px;color:#3B2500;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 var(--gold-edge);}
.pack .ribbon{position:absolute;top:10px;right:-4px;font-size:10px;font-weight:900;color:#fff;background:var(--coral);padding:2px 8px;border-radius:4px 0 0 4px;}

/* ---------- collection ---------- */
.showcase{position:relative;padding:16px;overflow:hidden;}
.showcase .stage{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:18px;height:130px;}
.showcase .stage::before{content:"";position:absolute;bottom:-6px;left:50%;width:240px;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side, rgba(255,255,255,.14), transparent);}
.showcase .spot{position:absolute;inset:-40px 20% auto;height:220px;background:radial-gradient(50% 60% at 50% 0%, rgba(255,240,200,.14), transparent 80%);pointer-events:none;}
.coll-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:12px;color:var(--ink-soft);}
.coll-head b{font-family:var(--num);font-size:17px;color:var(--ink);}
.progress{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;}
.progress b{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));}
.perks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.perk-chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(92,225,255,.08);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(92,225,255,.25);}
.perk-chip.none{background:none;color:var(--ink-mute);box-shadow:inset 0 0 0 1px var(--edge);}
.tab-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:14px 0 12px;padding:4px;border-radius:14px;background:rgba(4,8,28,.5);box-shadow:inset 0 0 0 1px var(--edge);}
.tab-switch button{padding:9px;border-radius:10px;border:none;background:none;color:var(--ink-mute);font-weight:900;font-size:13px;cursor:pointer;}
.tab-switch button.active{background:var(--panel-3);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;}
.item-card{
  position:relative;border:none;border-radius:14px;padding:24px 6px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:138px;
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  box-shadow:inset 0 0 0 1px var(--edge), inset 0 -3px 0 color-mix(in srgb, var(--rc) 80%, transparent);
}
.item-card.locked{cursor:default;}
.item-card.equipped{box-shadow:inset 0 0 0 2px var(--gold), inset 0 -3px 0 var(--gold);background:linear-gradient(180deg, rgba(245,196,81,.14), var(--panel));}
.item-card .rtag{position:absolute;top:6px;left:6px;}
.item-card .eq{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:900;color:#3B2500;background:var(--gold);padding:1px 6px;border-radius:4px;}
.item-card .nm{font-size:11px;font-weight:700;line-height:1.3;text-align:center;}
.item-card .perk{font-size:10px;font-weight:700;color:var(--cyan);line-height:1.3;text-align:center;}

/* ---------- results ---------- */
.res-hero{text-align:center;padding:24px 16px 18px;}
.res-hero .eyebrow{color:var(--gold);}
.res-hero h2{font-family:var(--display);font-weight:900;font-size:30px;margin-top:6px;}
.res-hero .winner{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:14px;}
.results-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.result-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--edge);}
.result-row.first{background:linear-gradient(90deg, rgba(245,196,81,.16), rgba(245,196,81,.03));box-shadow:inset 0 0 0 1px rgba(245,196,81,.45);}
.result-row .rank{font-family:var(--display);font-weight:900;font-size:22px;text-align:center;color:var(--ink-soft);}
.result-row.first .rank{color:var(--gold);}
.result-row .n{font-weight:900;}
.result-row .b{font-size:11px;color:var(--ink-mute);margin-top:2px;}
.result-row .score{font-family:var(--num);font-weight:800;font-size:22px;text-align:right;}
.result-row .score small{font-size:11px;color:var(--ink-mute);margin-left:2px;}
.score-break{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.score-break span{font-family:var(--num);font-size:11px;font-weight:700;background:rgba(255,255,255,.05);color:var(--ink-soft);padding:1px 7px;border-radius:5px;}
.reward-line{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-family:var(--num);font-size:12px;font-weight:700;color:#CDBBFF;margin-top:2px;}
.reward-line svg{width:13px;height:13px;}

/* ---------- rules ---------- */
.rules{padding:18px;}
.rule-block + .rule-block{margin-top:20px;padding-top:18px;border-top:1px solid var(--edge);}
.rule-block h3{font-family:var(--display);font-weight:900;font-size:16px;margin-bottom:8px;}
.rule-block p,.rule-block li{font-size:13px;color:var(--ink-soft);line-height:1.85;}
.rule-block p{margin:0;}
.rule-block ul{margin:0;padding-left:1.2em;}
.tile-guide{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.tile-guide div{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-soft);line-height:1.5;}
.tile-guide .ti{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--cat);box-shadow:0 0 0 2px var(--cat);}
.tile-guide .ti svg{width:15px;height:15px;}
.tile-guide b{display:block;color:var(--ink);font-size:12.5px;}

@media (max-width:380px){
  .tile-guide{grid-template-columns:1fr;}
  .logo-mark{font-size:38px;}
}


/* ---------- smartphone / touch optimization ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font-size:16px;}
button,.btn,.nav-btn,.back-btn,.mode-card,.job-option,.pack,.item-card,.recenter,.seg button,.stepper button,.color-dot{touch-action:manipulation;}
#app{
  width:100%;
  min-height:100dvh;
  padding-left:max(12px,env(safe-area-inset-left));
  padding-right:max(12px,env(safe-area-inset-right));
  padding-bottom:max(12px,env(safe-area-inset-bottom));
}
.hud{
  margin-left:calc(-1 * max(12px,env(safe-area-inset-left)));
  margin-right:calc(-1 * max(12px,env(safe-area-inset-right)));
  padding-left:max(12px,env(safe-area-inset-left));
  padding-right:max(12px,env(safe-area-inset-right));
}
.nav-btn,.back-btn,.stepper button{min-height:44px;}
.stepper button{width:44px;height:44px;}
.color-dot{width:32px;height:32px;}
.world3d{height:clamp(330px,56dvh,440px);}

@media (max-width:520px){
  #app{max-width:none;}
  .hud-row{gap:8px;}
  .hud-cur{max-width:42%;}
  .cur-pill{font-size:13px;}
  .nav{bottom:max(6px,env(safe-area-inset-bottom));border-radius:16px;padding:4px;}
  .nav-btn{padding:7px 1px 6px;font-size:9.5px;min-height:50px;}
  .nav-btn svg{width:21px;height:21px;}
  .page-head{padding-top:14px;}
  .join-row{flex-direction:column;}
  .join-row .btn{width:100%;}
  .code-input{width:100%;font-size:22px;letter-spacing:.22em;}
  .room-code{font-size:clamp(34px,12vw,52px);letter-spacing:.16em;padding-left:.16em;}
  .hero{padding-top:24px;}
  .setup-card{padding:14px;}
  .player-row{grid-template-columns:1fr;}
  .player-row .avatar{justify-self:start;}
  .player-row .controls{grid-column:1;}
  .world3d{border-radius:14px;}
  .map-frame{padding:4px;}
  .drive-hud{top:max(14px,env(safe-area-inset-top));left:10px;right:10px;}
  .modal-card{max-width:calc(100vw - 24px);max-height:calc(100dvh - 32px);overflow:auto;-webkit-overflow-scrolling:touch;}
}

@media (max-width:360px){
  .hud-who .nm small{display:none;}
  .hud-cur{max-width:46%;}
  .mode-card{padding:13px;gap:10px;}
  .mode-card .mi{width:44px;height:44px;}
  .btn{padding:13px 14px;}
  .seg button{padding:8px 10px;min-height:40px;}
}

@media (orientation:landscape) and (max-height:520px){

  .stage-strip{margin-top:6px;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition:none !important;}
}

function buildBoard(){

var BOARD = buildBoard();

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function layoutWorldPath(tiles){
  var rand = mulberry32(20260923);
  var pts = [], heading = 0, x = 0, y = 260, minY = 70, maxY = 500;
  pts.push({x:x,y:y});
  for(var i=1;i<tiles.length;i++){
    var kick = rand()*70 - 35;
    if(i % 7 === 0){ kick += rand()*110 - 55; }
    heading = heading*0.62 + kick;
    heading = Math.max(-78, Math.min(78, heading));
    var stepLen = 96 + rand()*40;
    var rad = heading * Math.PI/180;
    x += Math.cos(rad)*stepLen; y += Math.sin(rad)*stepLen;
    if(y < minY){ y = minY; heading = Math.abs(heading); }
    if(y > maxY){ y = maxY; heading = -Math.abs(heading); }
    pts.push({x:x,y:y});
  }
  var pad = 320, minX = Infinity, maxX = -Infinity, minYA = Infinity, maxYA = -Infinity;
  pts.forEach(function(p){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minYA=Math.min(minYA,p.y); maxYA=Math.max(maxYA,p.y); });
  var dx = pad - minX, dy = pad - minYA;
  pts.forEach(function(p,i){ tiles[i].x = Math.round(p.x + dx); tiles[i].y = Math.round(p.y + dy); });
  return { w: Math.round(maxX + dx + pad), h: Math.round(maxYA + dy + pad) };
}
var WORLD = layoutWorldPath(BOARD);
function smoothPath(pts){
  var d = 'M'+pts[0].x+' '+pts[0].y;
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2;
    var c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
    var c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
    d += ' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2.x+' '+p2.y;
  }
  return d;
}

function stageBoundaryX(i){
  if(i<=0) return 0;

  return Math.round((BOARD[i*STAGE_TILES-1].x + BOARD[i*STAGE_TILES].x)/2);

function buildTerrain(){

function buildDecor(){
  var rnd = mulberry32(777);
  var kinds = {town:['tree','tree','bush'],coast:['palm','wave','palm'],city:['bldg','bldg','tree'],snow:['pine','pine','mount'],stars:['lamp','crystal','crystal']};
  var html = '';
  for(var si=0; si<STAGES.length; si++){
    var x0 = stageBoundaryX(si), x1 = stageBoundaryX(si+1);
    var placed = 0, tries = 0;
    var target = Math.min(34, Math.round((x1-x0)*(WORLD.h-100)/(46*640)));
    while(placed < target && tries < 400){
      tries++;
      var x = x0 + 20 + rnd()*(x1-x0-40), y = 160 + rnd()*(WORLD.h-320);
      var ok = true;
      for(var i=0;i<BOARD.length && ok;i++){
        var t = BOARD[i], nx = BOARD[i+1];
        if(Math.hypot(t.x-x, t.y-y) < 62) ok = false;
        if(nx && Math.hypot((t.x+nx.x)/2-x, (t.y+nx.y)/2-y) < 54) ok = false;
      }
      if(!ok) continue;
      var k = kinds[STAGES[si].key][Math.floor(rnd()*3)];
      var s = 1.2 + rnd()*0.6;
      if(k==='wave') html += '<div class="flat-deco" style="left:'+Math.round(x)+'px;top:'+Math.round(y)+'px;">'+decoSVG(k,s*1.4,rnd)+'</div>';
      else html += '<div class="bb" style="left:'+Math.round(x)+'px;top:'+Math.round(y)+'px;"><div class="bb-in">'+decoSVG(k,s,rnd)+'</div></div>';
      placed++;
    }
  }
  return html;
}

function fmt(n){ return (n<0?'-':'') + Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
function findCar(id){ for(var i=0;i<CARS.length;i++){ if(CARS[i].id===id) return CARS[i]; } return CARS[0]; }
function findOutfit(id){ for(var i=0;i<OUTFITS.length;i++){ if(OUTFITS[i].id===id) return OUTFITS[i]; } return OUTFITS[0]; }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp0(n){ return n<0?0:n; }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function rint(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function curPlayer(){ return state.players[state.currentPlayerIndex]; }
function reducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

function getPerks(p){
  var out = {salary:0,bonus:0,guard:0,luck:0};
  [findCar(p.equippedCar).perk, findOutfit(p.equippedOutfit).perk, p.job?JOBS[p.job].perk:null].forEach(function(pk){
    if(!pk) return;
    Object.keys(pk).forEach(function(k){ out[k] += pk[k]; });
  });
  out.guard = Math.min(out.guard, 80);
  return out;
}
function perkText(perk){
  if(!perk) return '';
  return Object.keys(perk).map(function(k){ return PERK_LABELS[k]+' +'+perk[k]+'%'; }).join(' ');
}
/* money change with perks: bonus boosts positive windfalls, guard reduces losses */
function addMoney(p, amt, raw){
  var v = amt;
  if(!raw){
    var pk = getPerks(p);
    if(amt>0 && pk.bonus) v = Math.round(amt*(1+pk.bonus/100));
    if(amt<0 && pk.guard) v = Math.round(amt*(1-pk.guard/100));
  }
  var before = p.money;
  p.money = clamp0(p.money + v);
  return p.money - before;
}
function addGems(p, amt){ var b = p.gems; p.gems = clamp0(p.gems + amt); return p.gems - b; }
function M(v){ return {k:'money',v:v}; }
function G(v){ return {k:'gem',v:v}; }
function PT(v){ return {k:'pt',v:v}; }
function TX(label, cls){ return {k:'txt',label:label,cls:cls||''}; }

  if(c.k==='gem') return '<span class="chip gem">'+GEM_SVG+(c.v>0?'+':'')+fmt(c.v)+'</span>';
  if(c.k==='pt') return '<span class="chip pt">'+ico('sparkle')+'思い出 +'+fmt(c.v)+'pt</span>';
  return '<span class="chip txt '+c.cls+'">'+esc(c.label)+'</span>';
}

function resumeGame(){
  var loaded = state && state.suspended ? state : loadState();
  if(loaded){
    state = loaded;
    state.suspended = false;
    if(state.view==='setup' || state.view==='home') state.view = 'board';
    if(!state.mode) state.mode = 'local';
    state.driving = false; state.busy = false;
    saveState();
    render();
  }
}

function startGame(){
  var players = [];
  var saved = state.setup.savedCollections;
  for(var i=0;i<state.setup.count;i++){
    var nm = (state.setup.names[i]||'').trim() || ('プレイヤー'+(i+1));
    var carry = saved && saved[i];
    if(i===0 && !carry) carry = loadProfile();
    players.push({
      id:i, name:nm, cpu:!!state.setup.cpu[i],
      color:PLAYER_COLORS[state.setup.colors[i]] || PLAYER_COLORS[i%PLAYER_COLORS.length],
      money:300, gems: carry ? carry.gems : START_GEMS, position:0,
      job:null, jobLevel:0, married:false, children:0, house:false, memories:0,
      finished:false, finalScore:null, goalOrder:null,
      pity: carry ? (carry.pity||0) : 0,
      ownedCars: carry ? carry.ownedCars.slice() : ['car_n1'],
      ownedOutfits: carry ? carry.ownedOutfits.slice() : ['out_n1'],
      equippedCar: carry ? carry.equippedCar : 'car_n1',
      equippedOutfit: carry ? carry.equippedOutfit : 'out_n1'
    });
  }
  state.players = players;
  state.currentPlayerIndex = 0;
  state.gameStarted = true; state.gameOver = false; state.suspended = false;
  state.view = 'board'; state.lastPull = null;
  saveState();

}

var CAM_TILT = 58;
var lastCam = null, camTarget = null, camManual = false;
function roadAngleAt(i){
  var a = BOARD[Math.max(0,i-1)], b = BOARD[Math.min(BOARD.length-1,i+3)];
  return Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;
}
function cameraFor(pos){
  var t = BOARD[pos];
  var rz = -90 - roadAngleAt(pos);
  if(lastCam){ while(rz - lastCam.rz > 180) rz -= 360; while(rz - lastCam.rz < -180) rz += 360; }
  return {fx:t.x, fy:t.y, rz:rz};
}
function gateSVG(label, col){

    '<rect x="2" y="4" width="116" height="26" rx="7" fill="'+col+'" stroke="#fff" stroke-width="3"/>'+
    '<text x="60" y="23" text-anchor="middle" font-family="LR Sans, sans-serif" font-weight="900" font-size="15" fill="#fff" letter-spacing="2">'+label+'</text>'+
    '<circle cx="11.5" cy="8" r="4" fill="#FFE08A"/><circle cx="108.5" cy="8" r="4" fill="#FFE08A"/></svg>';
}
function buildStatic3D(){
  var h = '';
  /* stage signposts */
  for(var i=1;i<STAGES.length;i++){
    var t = BOARD[i*STAGE_TILES], ang = roadAngleAt(i*STAGE_TILES)*Math.PI/180;
    var nx = -Math.sin(ang)*58, ny = Math.cos(ang)*58;
    h += '<div class="bb" style="left:'+Math.round(t.x+nx)+'px;top:'+Math.round(t.y+ny)+'px;"><div class="bb-in stage-sign"><b>STAGE '+(i+1)+'</b><span>'+esc(STAGES[i].name)+'</span><i></i></div></div>';
  }
  /* start & goal gates */
  [[0,'START','#1DB483'],[BOARD.length-1,'GOAL','#E8A21B']].forEach(function(g){
    var t = BOARD[g[0]], a = roadAngleAt(g[0])*Math.PI/180;
    var gx = Math.round(t.x + Math.cos(a)*(g[0]?60:78)), gy = Math.round(t.y + Math.sin(a)*(g[0]?60:78));
    h += '<div class="bb" style="left:'+gx+'px;top:'+gy+'px;"><div class="bb-in" style="bottom:-4px;">'+gateSVG(g[1],g[2])+'</div></div>';
  });
  return h;
}

function renderTile3D(t){
  var big = t.type==='start' || t.type==='goal';

    else html += '<button id="rollBtn" class="btn btn-primary btn-block" onclick="rollDice()">サイコロをふる</button>';

      '<div class="meta">'+(p.finished?(p.goalOrder+'着でゴール'):((p.job?JOBS[p.job].name:'フリーター')+(p.married?'・既婚':'')+(p.children?'・子'+p.children:'')+(p.house?'・持ち家':'')))+'</div></div>'+
      '<div class="right">'+coinAmt(p.money)+'<div class="progress-mini"><b style="width:'+Math.round(p.position/(BOARD.length-1)*100)+'%"></b></div></div>'+
      '</div>';
  });
  html += '</div>';
  return html;
}
function setCam(c, instant){
  var cam = document.getElementById('cam');
  if(!cam) return;
  if(instant) cam.classList.add('dragging');
  cam.style.setProperty('--fx', c.fx+'px');
  cam.style.setProperty('--fy', c.fy+'px');
  cam.style.setProperty('--rz', c.rz.toFixed(2)+'deg');
  lastCam = {fx:c.fx, fy:c.fy, rz:c.rz};
}
function recenterMap(){
  var cam = document.getElementById('cam');
  if(cam) cam.classList.remove('dragging');
  camManual = false;
  setCam(camTarget);
  var b = document.getElementById('recenter'); if(b) b.hidden = true;
}
function initMap3D(){
  var box = document.getElementById('world3d'), cam = document.getElementById('cam');
  if(!box || !cam) return;
  box.style.setProperty('--vw', box.clientWidth+'px');
  box.style.setProperty('--vh', box.clientHeight+'px');
  var target = camTarget;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ setCam(target); }); });
  var drag = null;
  box.addEventListener('pointerdown', function(e){
    if(e.target.closest('button')) return;
    drag = {x:e.clientX, y:e.clientY, fx:lastCam?lastCam.fx:target.fx, fy:lastCam?lastCam.fy:target.fy};
    cam.classList.add('dragging'); box.classList.add('grabbing');
    try{ box.setPointerCapture(e.pointerId); }catch(err){}
  });
  box.addEventListener('pointermove', function(e){
    if(!drag) return;
    var dx = e.clientX-drag.x, dy = (e.clientY-drag.y)/Math.cos(CAM_TILT*Math.PI/180);
    var r = -(lastCam?lastCam.rz:target.rz)*Math.PI/180;
    var wx = dx*Math.cos(r) - dy*Math.sin(r), wy = dx*Math.sin(r) + dy*Math.cos(r);
    var fx = Math.max(0, Math.min(WORLD.w, drag.fx - wx)), fy = Math.max(0, Math.min(WORLD.h, drag.fy - wy));
    setCam({fx:fx, fy:fy, rz:lastCam?lastCam.rz:target.rz}, true);
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y) > 6){ camManual = true; var b = document.getElementById('recenter'); if(b) b.hidden = false; }
  });
  function end(){ drag = null; box.classList.remove('grabbing'); }
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}

function rollDice(){
  if(state.busy || NET.busyAnim) return;
  var p = curPlayer();
  if(!p || p.finished){ advanceTurn(); return; }
  if(isOnline() && !isMyTurn()) return;
  state.busy = true; state.lastRoll = null; state.stepping = false; state.stepsLeft = 0;
  if(state.view!=='board'){ state.view = 'board'; render(); }
  var btn = document.getElementById('rollBtn'); if(btn) btn.disabled = true;
  var from = p.position;
  playRollAnimation(p, null, function(roll){
    setTimeout(function(){ stepMove(p, roll); }, 650);
  }, function(roll){
    NET.pushEvent({kind:'roll', pi:state.currentPlayerIndex, roll:roll, from:from});
  });
}
/* dice overlay on the map; fixedRoll = result decided elsewhere (online spectator) */
function playRollAnimation(p, fixedRoll, onDone, onDecided){
  window.scrollTo(0,0);
  var ov = document.createElement('div');
  ov.className = 'roll-overlay';
  ov.innerHTML = '<div class="roll-who">'+esc(p.name)+' のサイコロ</div><div class="big-dice tumble">'+diceSVG(rint(1,6))+'</div><div class="roll-result"></div>';
  document.body.appendChild(ov);
  var dice = ov.querySelector('.big-dice'), small = document.getElementById('diceBox');
  var ticks = 0;
  var spin = setInterval(function(){
    var f = rint(1,6);
    dice.innerHTML = diceSVG(f);
    if(small) small.innerHTML = diceSVG(f);
    if(++ticks > 12){
      clearInterval(spin);
      var roll = fixedRoll || rint(1,6);
      state.lastRoll = roll;
      if(onDecided) onDecided(roll);
      dice.innerHTML = diceSVG(roll);
      dice.classList.remove('tumble'); dice.classList.add('land');
      if(small) small.innerHTML = diceSVG(roll);
      var res = ov.querySelector('.roll-result');
      res.innerHTML = '<b>'+roll+'</b> マス進む!';
      res.classList.add('show');
      setTimeout(function(){
        ov.classList.add('out');
        setTimeout(function(){
          if(ov.parentNode) ov.parentNode.removeChild(ov);
          state.driving = true;
          render();
          onDone(roll);
        }, 250);
      }, 1200);
    }
  }, 85);
}
function moveBy(p, delta){
  var before = getStageIndex(p.position);
  p.position = Math.max(0, Math.min(p.position+delta, BOARD.length-1));
  var after = getStageIndex(p.position);
  if(after>before) showToast('STAGE '+(after+1)+'「'+STAGES[after].name+'」に到着', 'map');
}
var STEP_MS = 650; /* 1マス進むのにかかる時間(ミリ秒) */
function stepMove(p, remaining){
  if(remaining<=0 || p.position>=BOARD.length-1){
    state.busy = false; state.stepping = false; state.stepsLeft = 0;
    saveState();
    render();
    setTimeout(function(){ resolveTile(BOARD[p.position], p); }, 250);
    return;
  }
  moveBy(p, 1);
  state.stepping = true; state.stepsLeft = remaining-1;
  render();
  var stopHere = BOARD[p.position].type==='job' && !p.job;
  if(stopHere) showToast('就職マスでストップ', 'bag');
  setTimeout(function(){ stepMove(p, stopHere ? 0 : remaining-1); }, STEP_MS);
}

/* =========================================================
   TILE RESOLUTION
   ========================================================= */
function resolveTile(tile, p){
  var m, t;
  switch(tile.type){
    case 'start': finishResolution('人生のスタート地点。良い旅を!', [], p); return;
    case 'job':
      if(p.job){ m = addMoney(p, 20); finishResolution('仕事にも慣れ、臨時手当をもらった。', [M(m)], p); }
      else showJobModal(p);
      return;
    case 'salary':
      var base = p.job ? JOBS[p.job].base * p.jobLevel : 20;
      var perk = getPerks(p).salary;
      m = addMoney(p, Math.round(base*(1+perk/100)), true);
      var chips = [M(m)];
      if(p.children){ chips.push(M(addMoney(p, -p.children*10, true))); }
      finishResolution('給料日!'+(perk?' 装備効果で給料が'+perk+'%アップ。':'')+(p.children?' 子ども'+p.children+'人分の養育費を支払った。':''), chips, p);
      return;
    case 'sidejob':
      var d = rint(1,6);
      m = addMoney(p, d*8);
      finishResolution('副業に精を出した。出目'+d+' × 8万円の収入!', [M(m)], p);
      return;
    case 'lottery':
      if(p.money < 10){ finishResolution('宝くじを買おうとしたが、お財布が空っぽだった…', [], p); return; }
      p.money -= 10;
      var r = Math.random();
      if(r < 0.06){ m = addMoney(p, 300); finishResolution('宝くじを10万円分購入…なんと1等当選!', [M(-10), M(m)], p); spawnConfetti(60); }
      else if(r < 0.30){ m = addMoney(p, 40); finishResolution('宝くじを10万円分購入…3等が当たった!', [M(-10), M(m)], p); }
      else finishResolution('宝くじを10万円分購入…残念、ハズレ。', [M(-10)], p);
      return;
    case 'promotion':
      if(p.job){
        p.jobLevel += 1;
        m = addMoney(p, 30*p.jobLevel, true);
        finishResolution('昇進した!基本給が '+JOBS[p.job].base*p.jobLevel+'万円 にアップ。', [M(m)], p);
      } else { m = addMoney(p, 20, true); finishResolution('アルバイトが評価され、時給が上がった。', [M(m)], p); }
      return;
    case 'marriage':
      if(p.married){ p.memories += 20; finishResolution('結婚記念日。家族で素敵なディナーを楽しんだ。', [PT(20)], p); return; }
      p.married = true;
      m = addMoney(p, 30, true);
      finishResolution('運命の人と出会い、結婚した!みんなからご祝儀が届いた。', [M(m), TX('家族 +50pt')], p);
      spawnConfetti(40);
      return;
    case 'child':
      if(p.married){
        p.children += 1;
        m = addMoney(p, -20, true);
        finishResolution('元気な赤ちゃんが生まれた!給料日ごとに養育費がかかるが、家族ボーナスが増える。', [M(m), TX('家族 +40pt')], p);
      } else { p.memories += 10; finishResolution('友人の出産祝いに駆けつけた。幸せをおすそ分けしてもらった。', [PT(10)], p); }
      return;
    case 'house': showHouseModal(p); return;
    case 'travel': showTravelModal(p); return;
    case 'party':
      var total = 0;
      state.players.forEach(function(o){
        if(o===p || o.finished) return;
        var give = Math.min(10, o.money); o.money -= give; total += give;
      });
      if(total===0) total = 20;
      p.money += total;
      finishResolution('誕生日パーティー!みんなからお祝い金が届いた。', [M(total)], p);
      return;
    case 'invest': resolveInvest(p, 15, 40, 10, 25, '投資に挑戦してみた。'); return;
    case 'biginvest': resolveInvest(p, 60, 150, 40, 90, '一世一代の大勝負に出た。'); return;
    case 'free_gacha':
      var res = performPull(p, 1, true), r0 = res[0];
      var item = r0.isCar ? findCar(r0.id) : findOutfit(r0.id);
      var extra = '<div class="rcard r-'+item.rarity+'" style="width:150px;min-height:0;padding-top:26px;">'+
        '<span class="rtag r-'+item.rarity+'">'+item.rarity+'</span>'+
        (r0.isCar?carSVG(item,110):charSVG(item,56))+'<div class="nm" style="font-size:12.5px;">'+esc(item.name)+'</div>'+
        (item.perk?'<div class="foot" style="color:var(--cyan)">'+perkText(item.perk)+'</div>':'')+'</div>';
      if(p.cpu) cpuAutoEquip(p);
      finishResolution('無料ガチャを1回引いた!', r0.isDup?[TX('所持済み'),G(r0.refund)]:[TX('NEW!')], p, {extra:extra});
      if(item.rarity==='SSR') spawnConfetti(60);
      return;
    case 'warp':
      var n = rint(2,4);
      moveBy(p, n); render();
      finishResolution('近道を発見!'+n+'マス先の「'+BOARD[p.position].name+'」へ進む。', [], p,
        {tile:tile, after:function(){ resolveTile(BOARD[p.position], p); }});
      return;
    case 'back':
      moveBy(p, -2); render();
      finishResolution('道を間違えて回り道…2マス戻ってしまった。', [], p, {tile:tile});
      return;
    case 'disaster':
      t = pickRandom(DISASTER_TEXTS);
      m = addMoney(p, t.m);
      var gd = getPerks(p).guard;
      finishResolution(t.t+(gd?' 装備効果で被害を'+gd+'%軽減した。':''), [M(m)], p);
      return;
    case 'bonus':
      t = pickRandom(BONUS_TEXTS);
      finishResolution(t.t, [M(addMoney(p, t.m))], p);
      return;
    case 'rest':
      t = pickRandom(REST_TEXTS);
      p.memories += t.pt;
      finishResolution(t.t, [PT(t.pt)], p);
      return;
    case 'event':
      t = pickRandom(EVENT_TEXTS);
      var ch = [];
      if(t.m) ch.push(M(addMoney(p, t.m)));
      if(t.g) ch.push(G(addGems(p, t.g)));
      if(t.pt){ p.memories += t.pt; ch.push(PT(t.pt)); }
      finishResolution(t.t, ch, p);
      return;
    case 'goal':
      var order = state.players.filter(function(o){ return o.finished; }).length;
      p.finished = true;
      p.goalOrder = order + 1;
      var gr = GOAL_GEM_REWARD[order] || 0;
      addGems(p, gr);
      var ob = GOAL_ORDER_BONUS[order] || 0;
      finishResolution(p.goalOrder+'着でゴール!おつかれさまでした。', [TX('順位ボーナス +'+ob+'pt'), G(gr)], p, {goal:true});
      spawnConfetti(50);
      return;
    default: advanceTurn();
  }
}
function resolveInvest(p, minG, maxG, minL, maxL, label){
  var luck = getPerks(p).luck;
  var succ = Math.min(0.85, 0.5 + luck/100);
  var roll = Math.random();
  if(roll < succ){
    var g = addMoney(p, rint(minG,maxG), true);
    finishResolution(label+'見事に成功!'+(luck?'(成功率'+Math.round(succ*100)+'%)':''), [M(g)], p);
  } else if(roll < succ + (1-succ)*0.55){
    finishResolution(label+'結果はとんとん。収支は変わらなかった。', [], p);
  } else {
    var l = addMoney(p, -rint(minL,maxL));
    finishResolution(label+'思うようにいかず、損をしてしまった…', [M(l)], p);
  }
}

function collectionStats(p){
  var total = CARS.length + OUTFITS.length, owned = p.ownedCars.length + p.ownedOutfits.length;
  return {owned:owned,total:total,pct:Math.round(owned/total*100)};
}
function computeScoreBreakdown(p){
  var b = {
    money: Math.round(p.money),
    house: p.house ? 200 : 0,
    family: (p.married?50:0) + p.children*40,
    memories: p.memories||0,
    order: p.goalOrder ? (GOAL_ORDER_BONUS[p.goalOrder-1]||0) : 0
  };
  b.total = b.money + b.house + b.family + b.memories + b.order;
  return b;
}

function cardShell(tile, title, inner){
  var cat = CATS[tile.cat];
  return '<div class="ev-card" role="dialog" aria-label="'+esc(title)+'" style="--cat:'+cat.color+'">'+
    '<div class="ev-head"><div class="ev-medal">'+ico(tile.icon)+'</div></div>'+
    '<div class="ev-body"><div class="ev-cat">'+esc(cat.label)+'マス</div><h3 class="ev-title">'+esc(title)+'</h3>'+inner+'</div></div>';

function openCard(tile, title, inner){ return openModal(cardShell(tile, title, inner)); }
var TITLE_BY_TYPE = {salary:'給料日',bonus:'臨時収入',disaster:'アクシデント',event:'人生のできごと',rest:'ひとやすみ',lottery:'宝くじ',sidejob:'副業',
  invest:'投資',biginvest:'大勝負',marriage:'結婚',child:'家族',house:'マイホーム',travel:'旅行',party:'パーティー',promotion:'昇進',
  job:'就職',warp:'近道',back:'回り道',free_gacha:'無料ガチャ',goal:'ゴール',start:'スタート'};
function finishResolution(text, chips, p, opts){
  opts = opts || {};
  var tile = opts.tile || BOARD[p.position];
  pendingAfter = opts.after || null;
  var chipsHtml = chips && chips.length ? '<div class="chips">'+chips.map(chipHTML).join('')+'</div>' : '';
  var inner = (opts.extra?'<div class="ev-extra">'+opts.extra+'</div>':'')+
    '<p class="ev-text">'+esc(text)+'</p>'+chipsHtml+
    '<button class="btn btn-primary btn-block" onclick="closeAndAdvance()">'+(pendingAfter?'進む':'OK')+'</button>'+
    (p.cpu?'<div class="auto-note">CPUのターン:自動で進みます</div>':'');
  var seq = openCard(tile, TITLE_BY_TYPE[tile.type]||tile.name, inner);
  if(isOnline()) NET.pushEvent({kind:'result', pi:state.players.indexOf(p), tile:tile.index, pos:p.position, text:text, chips:chips||[], extra:opts.extra||''});
  if(p.cpu) setTimeout(function(){ if(seq===modalSeq && isModalOpen()) closeAndAdvance(); }, 1800);
}
function closeAndAdvance(){
  if(!isModalOpen()) return;
  closeModal();
  var after = pendingAfter; pendingAfter = null;
  if(after){ saveState(); render(); setTimeout(after, 300); return; }
  state.driving = false;
  saveState();
  advanceTurn();
}
function advanceTurn(){
  if(state.players.every(function(p){ return p.finished; })){
    state.players.forEach(function(p){ p.finalScore = computeScoreBreakdown(p).total; });
    state.gameOver = true; state.view = 'board';
    saveState(); NET.pushState();
    if(isOnline() && viewPlayer()) profileFromPlayer(viewPlayer());
    render(); window.scrollTo(0,0);
    spawnConfetti(90);
    return;
  }
  var n = state.players.length, next = state.currentPlayerIndex;
  for(var i=0;i<n;i++){ next = (next+1)%n; if(!state.players[next].finished) break; }
  state.currentPlayerIndex = next;
  if(state.players[next].cpu) state.view = 'board';
  saveState();
  NET.pushState();
  render();
}

/* =========================================================
   CPU
   ========================================================= */
function scheduleCpu(){
  if(cpuTimer || !state.gameStarted || state.gameOver || state.busy || state.driving || isModalOpen()) return;
  var p = curPlayer();
  if(!p || !p.cpu || p.finished) return;
  cpuTimer = setTimeout(function(){
    cpuTimer = null;
    var q = curPlayer();
    if(!q || !q.cpu || q.finished || state.busy || state.driving || isModalOpen() || state.gameOver) return;
    cpuTakeTurn(q);
  }, 1100);
}
function cpuTakeTurn(p){
  if(p.gems >= PULL_COST + 100){
    var r = performPull(p, 1, false)[0], it = r.isCar ? findCar(r.id) : findOutfit(r.id);
    if(!r.isDup) showToast(p.name+' がガチャで【'+it.rarity+'】'+it.name+' をゲット', 'capsule');
    cpuAutoEquip(p);
  }
  rollDice();
}
function perkScore(it){
  var s = RARITY_ORDER.indexOf(it.rarity)*10;
  if(it.perk) Object.keys(it.perk).forEach(function(k){ s += it.perk[k]/5; });
  return s;
}
function cpuAutoEquip(p){
  var bc = p.ownedCars.map(findCar).sort(function(a,b){ return perkScore(b)-perkScore(a); })[0];
  var bo = p.ownedOutfits.map(findOutfit).sort(function(a,b){ return perkScore(b)-perkScore(a); })[0];
  if(bc) p.equippedCar = bc.id;
  if(bo) p.equippedOutfit = bo.id;
}

function renderGacha(){
  var p = viewPlayer();

  }

    }).join('')+

  return html;
}
function weightedRarity(){
  var total = 0; RARITY_ORDER.forEach(function(k){ total += RARITY_WEIGHTS[k]; });
  var r = Math.random()*total, acc = 0;
  for(var i=0;i<RARITY_ORDER.length;i++){ acc += RARITY_WEIGHTS[RARITY_ORDER[i]]; if(r<acc) return RARITY_ORDER[i]; }
  return 'N';
}
function pullOne(force){
  var rarity = weightedRarity();
  if(force && RARITY_ORDER.indexOf(rarity) < RARITY_ORDER.indexOf(force)) rarity = force;
  return pickRandom(CARS.concat(OUTFITS).filter(function(it){ return it.rarity===rarity; }));
}
function performPull(p, count, free){
  var cost = free ? 0 : (count===10 ? PULL10_COST : PULL_COST*count);
  if(p.gems < cost) return null;
  p.gems -= cost;
  var raw = [];
  for(var i=0;i<count;i++){
    p.pity = (p.pity||0) + 1;
    var force = null;
    if(p.pity >= PITY_MAX) force = 'SSR';
    else if(count===10 && i===count-1 && !raw.some(function(it){ return it.rarity!=='N'; })) force = 'R';
    var item = pullOne(force);
    if(item.rarity==='SSR') p.pity = 0;
    raw.push(item);
  }
  return raw.map(function(item){
    var isCar = item.id.indexOf('car_')===0;
    var list = isCar ? p.ownedCars : p.ownedOutfits;
    var isDup = list.indexOf(item.id) >= 0, refund = 0;
    if(isDup){ refund = DUP_REFUND[item.rarity]; p.gems += refund; } else list.push(item.id);
    return {id:item.id, isCar:isCar, isDup:isDup, refund:refund, rarity:item.rarity};
  });
}
var pullFinishFn = null;
function onlineLocked(){
  if(isOnline() && (!isMyTurn() || state.busy || NET.busyAnim)){ showToast('オンライン対戦中は、自分の番(サイコロをふる前)に使えます','bolt'); return true; }
  return false;
}
function doPull(count){
  var p = viewPlayer();
  if(p.cpu || onlineLocked()) return;
  var results = performPull(p, count, false);
  if(!results) return;
  state.lastPull = results;
  persistViewPlayer(p);
  var top = 'N';
  results.forEach(function(r){ if(RARITY_ORDER.indexOf(r.rarity) > RARITY_ORDER.indexOf(top)) top = r.rarity; });
  var titles = {N:'GET',R:'RARE!',SR:'SUPER RARE!!',SSR:'SSR!!!'};
  var done = false;
  pullFinishFn = function(){
    if(done) return; done = true; pullFinishFn = null;
    closeModal(); render();
    var el = document.getElementById('pullStage');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    if(top==='SSR') spawnConfetti(80);
  };
  openModal('<div class="capsule-stage top-'+top+'" onclick="skipPull()" role="button" aria-label="結果を見る">'+
    '<div class="rays"></div><div class="glow"></div><div class="pull-title">'+titles[top]+'</div>'+
    '<div class="capsule"><div class="cap-top"></div><div class="cap-bot"></div><div class="cap-band"></div><div class="cap-btn"></div></div>'+
    '<div class="pull-caption">タップでスキップ</div></div>', 'pull-overlay');
  setTimeout(function(){ if(pullFinishFn) pullFinishFn(); }, reducedMotion()?400:2000);
}
function skipPull(){ if(pullFinishFn) pullFinishFn(); }
function renderPullStage(){
  if(!state.lastPull || !state.lastPull.length) return '';
  return state.lastPull.map(function(r, idx){
    var it = r.isCar ? findCar(r.id) : findOutfit(r.id);
    return '<div class="rcard r-'+it.rarity+'" style="animation-delay:'+(idx*0.07)+'s">'+
      '<span class="rtag r-'+it.rarity+'">'+it.rarity+'</span>'+
      (r.isCar ? carSVG(it,76) : charSVG(it,44))+
      '<div class="nm">'+esc(it.name)+'</div>'+
      (r.isDup?'<span class="foot">所持済み +'+GEM_SVG+r.refund+'</span>':'<span class="new">NEW</span>')+'</div>';
  }).join('');
}
