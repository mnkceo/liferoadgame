/* =========================================================
   ONLINE (network layer)
   ---------------------------------------------------------
   All online traffic goes through NET.* below. Today it runs on the
   claude.ai page's shared database (claude.use("db")). A future native
   app can replace only this block (e.g. with Firebase / its own server)
   as long as it keeps the same functions:
     NET.createRoom / joinRoom / leaveRoom / startMatch
     NET.pushEvent(ev) / NET.pushState()
   and calls onRoomData(roomBody) / onSeatsData(seats[]) on changes.
   Room doc:  rooms/<CODE>                 {status, hostId, rev, game, event, ...}
   Seat doc:  rooms/<CODE>/seats/<client>  {cid, name, color, joinedAt, inv}
   ========================================================= */
var NET = {
  db:null, ready:false, checked:false, code:null, isHost:false,
  room:null, seats:[], unsubRoom:null, unsubSeats:null,
  appliedRev:0, lastEventSeq:0, seenFirst:false,
  queue:[], busyAnim:false, pendingRoom:null, chain:Promise.resolve()
};
var ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function myId(){
  if(NET._id) return NET._id;
  try{
    var id = localStorage.getItem('lr_client');
    if(!id){ id = 'c'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); localStorage.setItem('lr_client', id); }
    NET._id = id;
  }catch(e){ NET._id = 'c'+Math.random().toString(36).slice(2,12); }
  return NET._id;
}
function isOnline(){ return state.mode==='online'; }
function myIndex(){
  if(!isOnline()) return state.currentPlayerIndex;
  for(var i=0;i<state.players.length;i++){ if(state.players[i].cid===myId()) return i; }
  return -1;
}
function isMyTurn(){ return !isOnline() || (curPlayer() && curPlayer().cid===myId()); }
function viewPlayer(){
  if(!state.players || !state.players.length){
    if(!state.menuPlayer) state.menuPlayer = loadProfile();
    return state.menuPlayer;
  }
  var i = myIndex(); return state.players[i>=0?i:state.currentPlayerIndex];
}
function persistViewPlayer(p){
  if(!state.gameStarted){ saveProfile(p); return; }
  saveState(); NET.pushState();
}

/* per-device profile: the inventory you bring into online rooms */
function loadProfile(){
  var d = {name:'', color:0, gems:START_GEMS, pity:0, ownedCars:['car_n1'], ownedOutfits:['out_n1'], equippedCar:'car_n1', equippedOutfit:'out_n1'};
  try{ var raw = localStorage.getItem('lr_profile'); if(raw){ var p = JSON.parse(raw); for(var k in d){ if(p[k]!=null) d[k] = p[k]; } } }catch(e){}
  return d;
}
function saveProfile(p){ try{ localStorage.setItem('lr_profile', JSON.stringify(p)); }catch(e){} }
function profileFromPlayer(pl){
  var pr = loadProfile();
  pr.gems = pl.gems; pr.pity = pl.pity||0; pr.ownedCars = pl.ownedCars.slice(); pr.ownedOutfits = pl.ownedOutfits.slice();
  pr.equippedCar = pl.equippedCar; pr.equippedOutfit = pl.equippedOutfit;
  saveProfile(pr);
}

function netInit(){
  if(!(window.claude && typeof window.claude.use==='function')){ NET.checked = true; return; }
  window.claude.use('db').then(function(db){
    NET.db = db; NET.ready = !!db; NET.checked = true;
    if(!state.gameStarted || isOnline()) render();
    if(db) netTryRejoin();
  }).catch(function(){ NET.checked = true; });
}
function netTryRejoin(){
  var code = null;
  try{ code = localStorage.getItem('lr_room'); }catch(e){}
  if(!code || state.gameStarted) return;
  NET.db.doc('rooms/'+code).get().then(function(s){
    if(!s.exists){ try{ localStorage.removeItem('lr_room'); }catch(e){} return; }
    var r = s.data();
    var inGame = r.game && r.game.players && r.game.players.some(function(p){ return p.cid===myId(); });
    if((r.status==='playing' && inGame) || r.status==='lobby'){ NET.rejoinCode = code; NET.rejoinStatus = r.status; render(); }
  });
}
function netErr(e){
  var c = e && e.code;
  if(c==='quota_exceeded') showToast('ルームが満杯です。しばらくしてからお試しください','bolt');
  else if(c==='invalid_argument') showToast('このページを操作する権限がありません','bolt');
  else showToast('通信に失敗しました。もう一度お試しください','bolt');
}
function write(fn){ NET.chain = NET.chain.then(fn).catch(netErr); return NET.chain; }

function genCode(){ var s=''; for(var i=0;i<4;i++) s += ROOM_CHARS[Math.floor(Math.random()*ROOM_CHARS.length)]; return s; }
function seatBody(){
  var pr = loadProfile();
  return {cid:myId(), name:(state.online.name||'').trim() || 'プレイヤー', color:state.online.color, joinedAt:Date.now(),
    inv:{gems:pr.gems, pity:pr.pity, ownedCars:pr.ownedCars, ownedOutfits:pr.ownedOutfits, equippedCar:pr.equippedCar, equippedOutfit:pr.equippedOutfit}};
}
function rememberOnlineName(){
  var pr = loadProfile(); pr.name = state.online.name; pr.color = state.online.color; saveProfile(pr);
}
NET.createRoom = function(){
  if(!NET.ready || NET.working) return;
  rememberOnlineName();
  NET.working = true; render();
  var tries = 0;
  function attempt(){
    var code = genCode();
    return NET.db.doc('rooms/'+code).get().then(function(s){
      if(s.exists && ++tries < 5) return attempt();
      var now = Date.now();
      return NET.db.doc('rooms/'+code).set({code:code, status:'lobby', hostId:myId(), createdAt:now, updatedAt:now, rev:0, game:null, event:null})
        .then(function(){ return NET.db.doc('rooms/'+code+'/seats/'+myId()).set(seatBody()); })
        .then(function(){ netCleanupOldRooms(); enterRoom(code); });
    });
  }
  attempt().catch(netErr).then(function(){ NET.working = false; render(); });
};
NET.joinRoom = function(codeIn){
  var code = (codeIn||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){ showToast('4文字のルームコードを入力してください','bolt'); return; }
  if(!NET.ready || NET.working) return;
  rememberOnlineName();
  NET.working = true; render();
  var ref = NET.db.doc('rooms/'+code);
  ref.get().then(function(s){
    if(!s.exists){ showToast('ルーム '+code+' が見つかりません','bolt'); return; }
    var r = s.data();
    var inGame = r.game && r.game.players && r.game.players.some(function(p){ return p.cid===myId(); });
    if(r.status!=='lobby'){
      if(inGame){ enterRoom(code); return; }
      showToast('このルームはすでにゲーム中です','bolt'); return;
    }
    return NET.db.collection('rooms/'+code+'/seats').get().then(function(qs){
      var mine = qs.docs.some(function(d){ return d.id===myId(); });
      if(!mine && qs.size>=4){ showToast('ルームが満員です(最大4人)','bolt'); return; }
      return NET.db.doc('rooms/'+code+'/seats/'+myId()).set(seatBody()).then(function(){ enterRoom(code); });
    });
  }).catch(netErr).then(function(){ NET.working = false; render(); });
};
function enterRoom(code){
  NET.code = code;
  try{ localStorage.setItem('lr_room', code); }catch(e){}
  state.mode = 'online'; state.view = 'lobby';
  NET.seenFirst = false; NET.appliedRev = 0; NET.queue = []; NET.pendingRoom = null; NET.rejoinCode = null;
  if(NET.unsubRoom) NET.unsubRoom();
  if(NET.unsubSeats) NET.unsubSeats();
  NET.unsubRoom = NET.db.doc('rooms/'+code).onSnapshot(function(s){
    if(!s.exists){ roomClosed(); return; }
    onRoomData(s.data());
  }, function(){ showToast('ルームとの接続が切れました。開き直してください','bolt'); });
  NET.unsubSeats = NET.db.collection('rooms/'+code+'/seats').orderBy('joinedAt').onSnapshot(function(qs){
    onSeatsData(qs.docs.map(function(d){ return d.data(); }));
  });
  render();
}
function roomClosed(){
  showToast('ルームが解散されました','bolt');
  netDetach();
  state = freshState(); state.view = 'online';
  render();
}
function netDetach(){
  if(NET.unsubRoom) NET.unsubRoom();
  if(NET.unsubSeats) NET.unsubSeats();
  NET.unsubRoom = NET.unsubSeats = null;
  NET.code = null; NET.room = null; NET.seats = [];
  try{ localStorage.removeItem('lr_room'); }catch(e){}
}
NET.leaveRoom = function(){
  var code = NET.code, room = NET.room;
  if(code && NET.db){
    var jobs = [NET.db.doc('rooms/'+code+'/seats/'+myId()).delete()];
    if(room && room.hostId===myId() && room.status!=='playing') jobs.push(NET.db.doc('rooms/'+code).delete());
    Promise.all(jobs).catch(function(){});
  }
  netDetach();
  closeModal();
  state = freshState(); state.view = 'online';
  render();
};
NET.startMatch = function(){
  var room = NET.room;
  if(!room || room.hostId!==myId() || NET.seats.length<2) return;
  var players = NET.seats.slice(0,4).map(function(s,i){
    var inv = s.inv || {};
    return normalizePlayer({
      id:i, cid:s.cid, name:s.name, cpu:false, color:PLAYER_COLORS[s.color] || PLAYER_COLORS[i],
      money:300, gems:inv.gems!=null?inv.gems:START_GEMS, position:0,
      job:null, jobLevel:0, married:false, children:0, house:false, memories:0,
      finished:false, finalScore:null, goalOrder:null, pity:inv.pity||0,
      ownedCars:(inv.ownedCars||['car_n1']).slice(), ownedOutfits:(inv.ownedOutfits||['out_n1']).slice(),
      equippedCar:inv.equippedCar||'car_n1', equippedOutfit:inv.equippedOutfit||'out_n1'
    });
  });
  var rev = (room.rev||0) + 1;
  write(function(){
    return NET.db.doc('rooms/'+NET.code).update({status:'playing', rev:rev, updatedAt:Date.now(),
      game:{players:players, currentPlayerIndex:0}, event:null});
  });
};
NET.backToLobby = function(){
  var room = NET.room;
  if(!room || room.hostId!==myId()) return;
  var rev = (room.rev||0) + 1;
  write(function(){ return NET.db.doc('rooms/'+NET.code).update({status:'lobby', rev:rev, updatedAt:Date.now(), game:null, event:null}); });
};
NET.pushState = function(){
  if(!isOnline() || !NET.code) return;
  var rev = Math.max(NET.appliedRev, (NET.room&&NET.room.rev)||0) + 1;
  NET.appliedRev = rev;
  var body = {rev:rev, updatedAt:Date.now(), status:state.gameOver?'over':'playing',
    game:{players:JSON.parse(JSON.stringify(state.players)), currentPlayerIndex:state.currentPlayerIndex}};
  write(function(){ return NET.db.doc('rooms/'+NET.code).update(body); });
};
NET.pushEvent = function(ev){
  if(!isOnline() || !NET.code) return;
  ev.seq = Date.now()*10 + Math.floor(Math.random()*10);
  ev.by = myId();
  NET.lastEventSeq = ev.seq;
  write(function(){ return NET.db.doc('rooms/'+NET.code).update({event:ev, updatedAt:Date.now()}); });
};
function netCleanupOldRooms(){
  var cutoff = Date.now() - 2*24*3600*1000;
  NET.db.collection('rooms').where('updatedAt','<',cutoff).limit(10).get().then(function(qs){
    qs.docs.forEach(function(d){
      NET.db.collection('rooms/'+d.id+'/seats').get().then(function(ss){
        ss.docs.forEach(function(x){ NET.db.doc('rooms/'+d.id+'/seats/'+x.id).delete().catch(function(){}); });
        NET.db.doc('rooms/'+d.id).delete().catch(function(){});
      });
    });
  }).catch(function(){});
}

/* ---------- incoming ---------- */
function onSeatsData(seats){
  NET.seats = seats;
  if(state.view==='lobby' && !state.gameStarted) render();
}
function onRoomData(r){
  NET.room = r;
  if(!NET.seenFirst){ NET.seenFirst = true; NET.lastEventSeq = r.event ? r.event.seq : 0; }
  if(r.status==='lobby'){
    if(state.gameStarted){
      /* host started a rematch: go back to the lobby with our latest inventory */
      var me = viewPlayer();
      if(me) profileFromPlayer(me);
      state = freshState(); state.mode = 'online'; state.view = 'lobby';
      state.online = onlineForm();
      NET.appliedRev = r.rev||0; NET.queue = []; NET.pendingRoom = null;
      closeModal();
      NET.db.doc('rooms/'+NET.code+'/seats/'+myId()).set(seatBody()).catch(function(){});
    }
    render();
    return;
  }
  if(r.event && r.event.seq > NET.lastEventSeq){
    NET.lastEventSeq = r.event.seq;
    if(r.event.by !== myId()) NET.queue.push(r.event);
  }
  if((r.rev||0) > NET.appliedRev) NET.pendingRoom = r;
  pumpRemote();
}
function applyRoom(r){
  NET.appliedRev = r.rev||0;
  NET.pendingRoom = null;
  var wasOver = state.gameOver;
  state.players = r.game.players.map(normalizePlayer);
  state.currentPlayerIndex = r.game.currentPlayerIndex;
  state.gameStarted = true;
  state.gameOver = r.status==='over';
  state.driving = false; state.busy = false; state.stepping = false;
  if(state.view==='lobby') state.view = 'board';
  if(isMyTurn() && !state.gameOver && state.view!=='board' && !NET.notifiedTurn){ showToast('あなたの番です','sparkle'); }
  if(state.gameOver){
    var me = viewPlayer();
    if(me) profileFromPlayer(me);
    if(!wasOver){ state.view = 'board'; spawnConfetti(80); }
  }
  render();
}
/* play queued remote events one by one, then apply the latest state */
function pumpRemote(){
  if(NET.busyAnim) return;
  if(NET.queue.length){
    var ev = NET.queue.shift();
    NET.busyAnim = true;
    playRemoteEvent(ev, function(){ NET.busyAnim = false; pumpRemote(); });
    return;
  }
  if(NET.pendingRoom && !state.busy) applyRoom(NET.pendingRoom);
}
function playRemoteEvent(ev, done){
  var p = state.players[ev.pi];
  if(!p){ done(); return; }
  if(ev.kind==='roll'){
    closeModal();
    p.position = ev.from;
    state.currentPlayerIndex = ev.pi;
    state.view = 'board';
    state.busy = true;
    playRollAnimation(p, ev.roll, function(roll){
      remoteMove(p, roll, function(){ state.busy = false; done(); });
    });
    return;
  }
  if(ev.kind==='result'){
    if(ev.pos!=null) p.position = ev.pos;
    state.driving = true;
    render();
    var tile = BOARD[ev.tile] || BOARD[p.position];
    var inner = (ev.extra?'<div class="ev-extra">'+ev.extra+'</div>':'')+
      '<p class="ev-text">'+esc(ev.text)+'</p>'+
      (ev.chips && ev.chips.length ? '<div class="chips">'+ev.chips.map(chipHTML).join('')+'</div>' : '')+
      '<button class="btn btn-primary btn-block" onclick="closeRemoteCard()">OK</button>'+
      '<div class="auto-note">'+esc(p.name)+' さんのターン</div>';
    var seq = openCard(tile, TITLE_BY_TYPE[tile.type]||tile.name, inner);
    NET.remoteDone = function(){ NET.remoteDone = null; closeModal(); done(); };
    setTimeout(function(){ if(seq===modalSeq && NET.remoteDone) NET.remoteDone(); }, 3200);
    return;
  }
  if(ev.kind==='toast'){ showToast(ev.text, ev.icon||'sparkle'); done(); return; }
  done();
}
function closeRemoteCard(){ if(NET.remoteDone) NET.remoteDone(); }
function remoteMove(p, remaining, done){
  if(!state.driving){ state.driving = true; render(); setTimeout(function(){ remoteMove(p, remaining, done); }, 650); return; }
  if(remaining<=0 || p.position>=BOARD.length-1){ state.stepping = false; render(); done(); return; }
  moveBy(p, 1);
  state.stepping = true; state.stepsLeft = remaining-1;
  render();
  var stop = BOARD[p.position].type==='job' && !p.job;
  setTimeout(function(){ remoteMove(p, stop?0:remaining-1, done); }, STEP_MS);
}

  if(!NET.ready){
    html += '<section class="panel setup-card"><p style="margin:0 0 8px;font-weight:900;">この画面ではオンライン対戦を使えません</p>'+
      '<p class="note" style="margin:0;">オンライン対戦は、claude.ai で公開したゲームページを開いたときに使えます。ファイルを直接開いた場合は「ひとりで遊ぶ」「みんなで遊ぶ」を選んでください。</p></section>';
    return html;
  }
  var dis = NET.working ? ' disabled' : '';
  html += '<section class="panel setup-card"><div class="eyebrow">YOU</div>'+
    '<div class="player-row" style="margin-top:10px;"><div class="avatar" style="--pc:'+PLAYER_COLORS[f.color]+'">'+charSVG(findOutfit(loadProfile().equippedOutfit),30)+'</div>'+
    '<input type="text" id="onlineName" maxlength="8" placeholder="なまえ" value="'+esc(f.name)+'" oninput="state.online.name=this.value" aria-label="あなたの名前">'+
    '<div class="controls"><div class="color-picker">'+PLAYER_COLORS.map(function(c,ci){
      return '<button class="color-dot'+(f.color===ci?' selected':'')+'" style="background:'+c+'" onclick="state.online.color='+ci+';render()" aria-label="色'+(ci+1)+'"></button>';
    }).join('')+'</div></div></div></section>';
  html += '<section class="panel setup-card" style="margin-top:12px;"><div class="eyebrow">CREATE</div>'+
    '<p class="note" style="margin:6px 0 12px;">ルームを作ると4文字のコードが発行されます。友だちにコードを伝えて参加してもらいましょう(2〜4人)。</p>'+
    '<button class="btn btn-primary btn-block" onclick="NET.createRoom()"'+dis+'>ルームを作る</button></section>';
  html += '<section class="panel setup-card" style="margin-top:12px;"><div class="eyebrow">JOIN</div>'+
    '<div class="join-row"><input type="text" id="roomCode" class="code-input" maxlength="4" placeholder="ABCD" value="'+esc(f.code)+'" oninput="state.online.code=this.value.toUpperCase();this.value=state.online.code" aria-label="ルームコード" autocomplete="off">'+
    '<button class="btn btn-gem" onclick="NET.joinRoom(state.online.code)"'+dis+'>参加する</button></div></section>';
  html += '<p class="note">このページを共有された人どうしで遊べます。参加する人には「操作できる」以上の共有権限が必要です。</p>';
  return html;
}
function renderLobby(){
  var r = NET.room, host = r && r.hostId===myId();
  var html = '<div class="page-head"><button class="back-btn" onclick="NET.leaveRoom()" aria-label="ルームを出る">'+ico('detour')+'</button><div><div class="eyebrow">LOBBY</div><h2>ルーム</h2></div></div>';
  html += '<section class="panel code-card"><div class="eyebrow">ROOM CODE</div><div class="room-code">'+(NET.code||'----')+'</div>'+
    '<button class="btn btn-ghost" onclick="copyRoomCode()">コードをコピー</button>'+
    '<p class="note" style="margin:10px 0 0;">友だちはホームの「オンライン対戦」からこのコードで参加できます</p></section>';
  html += '<section class="panel setup-card" style="margin-top:12px;"><div class="row-head"><div class="eyebrow">PLAYERS</div><span class="seat-count">'+NET.seats.length+' / 4</span></div><div class="seat-list">';
  for(var i=0;i<4;i++){
    var s = NET.seats[i];
    if(s){
      html += '<div class="seat"><div class="avatar" style="--pc:'+(PLAYER_COLORS[s.color]||'#fff')+'">'+charSVG(findOutfit((s.inv&&s.inv.equippedOutfit)||'out_n1'),30)+'</div>'+
        '<b>'+esc(s.name)+'</b>'+(s.cid===myId()?'<span class="you">あなた</span>':'')+(r && s.cid===r.hostId?'<span class="host">ホスト</span>':'')+'</div>';
    } else {
      html += '<div class="seat empty"><div class="avatar"></div><span>参加を待っています…</span></div>';
    }
  }
  html += '</div></section>';
  if(host){
    html += '<button class="btn btn-primary btn-block" style="margin-top:16px;font-size:17px;padding:16px;" onclick="NET.startMatch()"'+(NET.seats.length<2?' disabled':'')+'>'+(NET.seats.length<2?'あと1人以上そろうと開始できます':'ゲームスタート')+'</button>';
  } else {
    html += '<div class="panel wait-card">ホストがゲームを開始するのを待っています…</div>';
  }
  html += '<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="NET.leaveRoom()">ルームを出る</button>';
  return html;
}
function copyRoomCode(){
  var code = NET.code || '';
  try{
    navigator.clipboard.writeText(code).then(function(){ showToast('コード '+code+' をコピーしました','sparkle'); }, function(){ showToast('コード: '+code,'sparkle'); });
  }catch(e){ showToast('コード: '+code,'sparkle'); }
}

/* =========================================================
   BOOT
   ========================================================= */
(function boot(){
  var loaded = loadState();
  state = loaded || freshState();
  if(state.gameStarted && !state.players){ state = freshState(); }
  state.driving = false; state.busy = false;
  if(!state.gameStarted) state.view = 'home';
  if(state.mode==='online'){ state = freshState(); }
  render();
  netInit();
})();
</script>
